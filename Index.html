    <!-- WebSocket Error Guard for Cloud Preview & Sandboxed iFrames -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var originalConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var firstArg = args[0] ? String(args[0]) : '';
            if (
              firstArg.indexOf('[vite] failed to connect to websocket') !== -1 ||
              firstArg.indexOf('WebSocket closed without opened') !== -1 ||
              firstArg.indexOf('failed to connect to websocket') !== -1
            ) {
              return;
            }
            return originalConsoleError.apply(console, args);
          };

          window.addEventListener('error', function(event) {
            if (event && event.message && (
              event.message.indexOf('WebSocket') !== -1 ||
              event.message.indexOf('websocket') !== -1 ||
              event.message.indexOf('failed to connect') !== -1
            )) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          }, true);

          try {
            var NativeWS = window.WebSocket;
            if (NativeWS) {
              window.WebSocket = function(url, protocols) {
                if (protocols === 'vite-hmr' || protocols === 'vite-ping' || (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1))) {
                  var listeners = {};
                  var mockSocket = {
                    readyState: 1,
                    url: url,
                    protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                    addEventListener: function(type, fn) {
                      listeners[type] = listeners[type] || [];
                      listeners[type].push(fn);
                      if (type === 'open') {
                        setTimeout(function() { fn({ type: 'open' }); }, 10);
                      }
                    },
                    removeEventListener: function(type, fn) {
                      if (!listeners[type]) return;
                      listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                    },
                    send: function() {},
                    close: function() {
                      mockSocket.readyState = 3;
                      if (listeners['close']) {
                        listeners['close'].forEach(function(fn) { fn({ type: 'close', wasClean: true }); });
                      }
                    }
                  };
                  return mockSocket;
                }

                try {
                  return protocols ? new NativeWS(url, protocols) : new NativeWS(url);
                } catch (e) {
                  return {
                    readyState: 3,
                    addEventListener: function() {},
                    removeEventListener: function() {},
                    send: function() {},
                    close: function() {}
                  };
                }
              };
              window.WebSocket.prototype = NativeWS.prototype;
              window.WebSocket.CONNECTING = NativeWS.CONNECTING;
              window.WebSocket.OPEN = NativeWS.OPEN;
              window.WebSocket.CLOSING = NativeWS.CLOSING;
              window.WebSocket.CLOSED = NativeWS.CLOSED;
            }
          } catch (e) {}
        }
      })();
    </script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function(reg) {
            console.log('TWC CareCRM ServiceWorker registered with scope: ', reg.scope);
          }).catch(function(err) {
            console.log('TWC CareCRM ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
